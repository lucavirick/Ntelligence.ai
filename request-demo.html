    <title>Request a Demo | Ntelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .demo-page {
            max-width: 820px;
            margin: 0 auto;
            padding: 7rem 2rem 5rem;
            color: var(--text-soft, rgba(237, 232, 223, 0.85));
            line-height: 1.6;
        }

        .demo-page h1 {
            font-size: clamp(2.4rem, 5.5vw, 3.6rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 1.25rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--accent);
        }

        .demo-page h1 em {
            font-style: normal;
            font-weight: 700;
            color: var(--accent);
        }

        .demo-page .lede {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-soft, rgba(237, 232, 223, 0.82));
            margin-bottom: 3rem;
            max-width: 660px;
            line-height: 1.7;
        }

        .demo-page h2 {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-top: 2.75rem;
            margin-bottom: 1rem;
        }

        .demo-page p {
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 1rem;
            color: var(--text-soft, rgba(237, 232, 223, 0.82));
        }

        .demo-page ul {
            list-style: none;
            padding-left: 0;
            margin: 0 0 2rem;
        }

        .demo-page li {
            position: relative;
            padding-left: 1.4rem;
            margin-bottom: 0.65rem;
            font-size: 1rem;
            color: var(--text-soft, rgba(237, 232, 223, 0.82));
        }

        .demo-page li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.65em;
            width: 8px;
            height: 1px;
            background: var(--accent);
        }

        .demo-page a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.25s;
        }

        .demo-page a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2.5rem;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: opacity 0.25s;
        }

        .back-link:hover { opacity: 0.8; }

        .demo-form-card {
            margin-top: 3rem;
            padding: 3rem 2.5rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.018);
        }

        .demo-form-card .form-row {
            display: flex;
            gap: 1.5rem;
        }

        .demo-form-card .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .demo-form-card label {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-soft, rgba(237, 232, 223, 0.85));
            margin-bottom: 0.5rem;
        }

        .demo-form-card label .required {
            color: var(--accent);
            margin-left: 0.15em;
        }

        .demo-form-card input,
        .demo-form-card textarea,
        .demo-form-card select {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text, #ede8df);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line, rgba(237, 232, 223, 0.1));
            border-radius: 4px;
            padding: 0.75rem 1rem;
            transition: border-color 0.25s;
            -webkit-appearance: none;
        }

        .demo-form-card input:focus,
        .demo-form-card textarea:focus,
        .demo-form-card select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .demo-form-card input::placeholder,
        .demo-form-card textarea::placeholder {
            color: var(--muted, rgba(237, 232, 223, 0.4));
        }

        .demo-form-card select option {
            background: #1a1410;
            color: var(--text, #ede8df);
        }

        .demo-form-card .systems-group {
            margin-bottom: 1.5rem;
        }

        .demo-form-card .systems-group label.group-label {
            display: block;
            margin-bottom: 0.75rem;
        }

        .demo-form-card .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.6rem 1.5rem;
        }

        .demo-form-card .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            cursor: pointer;
        }

        .demo-form-card .checkbox-grid input[type="checkbox"] {
            -webkit-appearance: auto;
            appearance: auto;
            width: 16px;
            height: 16px;
            padding: 0;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .demo-form-card textarea {
            resize: vertical;
            min-height: 120px;
        }

        .demo-form-card .submit-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            padding: 0.9rem 2.5rem;
            cursor: pointer;
            transition: opacity 0.25s;
        }

        .demo-form-card .submit-btn:hover {
            opacity: 0.85;
        }

        .demo-form-card .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .demo-form-card .form-status {
            margin-top: 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            min-height: 1.4em;
        }

        .demo-form-card .form-status.success {
            color: #22c55e;
        }

        .demo-form-card .form-status.error {
            color: var(--accent);
        }

        .demo-page .fallback-cta {
            margin-top: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .demo-page .fallback-cta .label {
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.25rem;
        }

        .demo-page .fallback-cta a {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
        }

        @media (max-width: 700px) {
            .demo-page { padding: 5.5rem 1.25rem 4rem; }
            .demo-form-card { padding: 2rem 1.5rem; }
            .demo-form-card .form-row { flex-direction: column; gap: 0; }
            .demo-form-card .checkbox-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>

<body>
    <main class="demo-page">
        <a href="index.html" class="back-link">&larr; Return to Ntelligence</a>

        <h1>Request a <em>demo.</em></h1>
        <p class="lede">Tell us about one workflow you want to compress and we&rsquo;ll walk through how Ntelligence handles it.</p>

        <div class="demo-form-card">
            <form id="demo-form" action="https://formspree.io/f/xnjwzobk" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name <span class="required">*</span></label>
                        <input type="text" id="name" name="name" required placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <label for="email">Work Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="you@company.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="company">Company <span class="required">*</span></label>
                        <input type="text" id="company" name="company" required placeholder="Company name">
                    </div>
                    <div class="form-group">
                        <label for="role">Role / Title</label>
                        <input type="text" id="role" name="role" placeholder="e.g. FP&amp;A Director">
                    </div>
                </div>
                <div class="systems-group">
                    <label class="group-label">Current Systems</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="systems" value="SAP"> SAP</label>
                        <label><input type="checkbox" name="systems" value="Oracle EPM"> Oracle EPM</label>
                        <label><input type="checkbox" name="systems" value="OneStream"> OneStream</label>
                        <label><input type="checkbox" name="systems" value="Anaplan"> Anaplan</label>
                        <label><input type="checkbox" name="systems" value="PeopleSoft"> PeopleSoft</label>
                        <label><input type="checkbox" name="systems" value="Workday"> Workday</label>
                        <label><input type="checkbox" name="systems" value="Other"> Other</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="workflow">Workflow You Want to Compress</label>
                    <textarea id="workflow" name="workflow" placeholder="Describe one workflow you would like to see automated or accelerated."></textarea>
                </div>
                <button type="submit" class="submit-btn">Request Demo</button>
                <div id="demo-form-status" class="form-status"></div>
            </form>
        </div>

        <div class="fallback-cta">
            <span class="label">Or reach us directly</span>
            <a href="mailto:engage@thenthpower.com">engage@thenthpower.com</a>
        </div>
    </main>
    <script>
        const demoForm = document.getElementById('demo-form');
        const formStatus = document.getElementById('demo-form-status');

        if (demoForm) {
            demoForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                const data = new FormData(this);
                const action = this.action;

                formStatus.className = 'form-status';
                formStatus.innerText = 'Sending...';

                try {
                    const response = await fetch(action, {
                        method: 'POST',
                        body: data,
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        demoForm.reset();
                        formStatus.innerText = 'Thanks for your interest. We will be in touch within one business day.';
                        formStatus.classList.add('success');
                    } else {
                        const jsonData = await response.json();
                        if (jsonData.errors) {
                            formStatus.innerText = jsonData.errors.map(error => error.message).join(", ");
                        } else {
                            formStatus.innerText = "There was a problem submitting your request. Please try again.";
                        }
                        formStatus.classList.add('error');
                    }
                } catch (error) {
                    formStatus.innerText = "There was a problem submitting your request. Please try again.";
                    formStatus.classList.add('error');
                }
            });
        }
    </script>
</body>

</html>
